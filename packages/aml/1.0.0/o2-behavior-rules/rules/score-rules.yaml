kind: O2ScoreRules
rules:
  - id: RULE-AML-SCORE-FANOUT
    name: 分散转入集中转出
    description: 多账户小额转入、单账户大额转出
    weight: 0.25
    expression: "min(1, inboundCount/10) * min(1, outboundAmount/100000)"
    threshold: 0.6
    evidenceTemplate: "近 {windowDays} 日转入 {inboundCount} 笔、转出 {outboundAmount} 元"

  - id: RULE-AML-SCORE-FASTFLOW
    name: 快进快出
    description: 资金到账后短时间内集中转出
    weight: 0.25
    expression: "min(1, fastInOutRatio)"
    threshold: 0.5
    evidenceTemplate: "快进快出资金占比 {fastInOutRatio}"

  - id: RULE-AML-SCORE-NIGHT
    name: 夜间占比
    description: 夜间时段交易占比异常
    weight: 0.2
    expression: "min(1, nightRatio)"
    threshold: 0.6
    evidenceTemplate: "夜间交易占比 {nightRatio}"

  - id: RULE-AML-SCORE-LISTHIT
    name: 命中名单
    description: 客户/账户命中风险名单
    weight: 0.3
    expression: "min(1, listHitCount)"
    threshold: 1
    evidenceTemplate: "命中风险名单 {listHitCount} 次"
