<svg viewBox="0 0 880 1145" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#4A6FA5" stroke-width="1.2"/>
    </marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#B07D2B" stroke-width="1.2"/>
    </marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#2E8B74" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; }
    .hd { font-size: 17px; font-weight: 500; fill: #1B2430; }
    .tt { font-size: 13px; font-weight: 500; fill: #1B2430; }
    .bd { font-size: 11px; font-weight: 400; fill: #3A4A5C; }
    .sm { font-size: 11px; font-weight: 400; fill: #6B7B8C; }
    .kw { font-size: 11.5px; font-weight: 500; fill: #FFFFFF; }
    .chip { font-size: 10px; font-weight: 500; fill: #FFFFFF; }
    .lane { font-size: 12px; font-weight: 500; fill: #1B2430; }
  </style>
  <text x="24" y="30" class="hd" text-anchor="start">Universal three lanes: modeling → delivery → operations</text>
  <text x="24" y="50" class="sm" text-anchor="start">Any domain: finance / hospitals / research / logistics / manufacturing…   blue=modeling  amber=delivery  teal=operations  purple=sources</text>
  <rect x="24" y="70" width="832" height="460" rx="10" fill="#E4EDF6" stroke="#8FB4D9" stroke-width="1"/>
  <text x="38" y="92" class="lane" text-anchor="start">Modeling lane · from business problem to human issue</text>
  <rect x="44" y="104" width="792" height="56" rx="8" fill="#FFFFFF" stroke="#8FB4D9" stroke-width="1"/>
  <text x="60" y="126" class="tt" text-anchor="start">① Define the business problem (before sources)</text>
  <text x="60" y="148" class="bd" text-anchor="start">scenario goals · scope · expected results · counter-examples — answer “what problem are we solving”</text>
  <line x1="440" y1="160" x2="440" y2="180" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="44" y="182" width="792" height="86" rx="8" fill="#FFFFFF" stroke="#8FB4D9" stroke-width="1"/>
  <text x="60" y="204" class="tt" text-anchor="start">② Pick sources as needed (six types, not mandatory steps)</text>
  <rect x="54" y="214" width="120" height="44" rx="6" fill="#B799D4" stroke="#B799D4" stroke-width="1"/>
  <text x="114.0" y="231" class="kw" text-anchor="middle">Legacy systems</text>
  <text x="114.0" y="247" class="chip" text-anchor="middle">LEGACY_SYS</text>
  <rect x="182" y="214" width="120" height="44" rx="6" fill="#B799D4" stroke="#B799D4" stroke-width="1"/>
  <text x="242.0" y="231" class="kw" text-anchor="middle">Case samples</text>
  <text x="242.0" y="247" class="chip" text-anchor="middle">CASE_SAMPLE</text>
  <rect x="310" y="214" width="120" height="44" rx="6" fill="#B799D4" stroke="#B799D4" stroke-width="1"/>
  <text x="370.0" y="231" class="kw" text-anchor="middle">Policies</text>
  <text x="370.0" y="247" class="chip" text-anchor="middle">POLICY</text>
  <rect x="438" y="214" width="120" height="44" rx="6" fill="#B799D4" stroke="#B799D4" stroke-width="1"/>
  <text x="498.0" y="231" class="kw" text-anchor="middle">Schema / API</text>
  <text x="498.0" y="247" class="chip" text-anchor="middle">SCHEMA_API</text>
  <rect x="566" y="214" width="120" height="44" rx="6" fill="#B799D4" stroke="#B799D4" stroke-width="1"/>
  <text x="626.0" y="231" class="kw" text-anchor="middle">Work orders</text>
  <text x="626.0" y="247" class="chip" text-anchor="middle">WORK_ORDER</text>
  <rect x="694" y="214" width="120" height="44" rx="6" fill="#B799D4" stroke="#B799D4" stroke-width="1"/>
  <text x="754.0" y="231" class="kw" text-anchor="middle">Conversation</text>
  <text x="754.0" y="247" class="chip" text-anchor="middle">CONVERSATION</text>
  <line x1="440" y1="268" x2="440" y2="288" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="44" y="290" width="792" height="104" rx="8" fill="#FFFFFF" stroke="#8FB4D9" stroke-width="1"/>
  <text x="60" y="312" class="tt" text-anchor="start">③ Model the ontology O1 · O2 · O3</text>
  <rect x="56" y="320" width="244" height="44" rx="6" fill="#E4EDF6" stroke="#8FB4D9" stroke-width="1"/>
  <text x="66" y="338" class="bd" text-anchor="start">O1 Objects</text>
  <text x="66" y="356" class="sm" text-anchor="start">objects · relations · dictionaries</text>
  <rect x="318" y="320" width="244" height="44" rx="6" fill="#E4EDF6" stroke="#8FB4D9" stroke-width="1"/>
  <text x="328" y="338" class="bd" text-anchor="start">O2 Rules</text>
  <text x="328" y="356" class="sm" text-anchor="start">behaviors (Action) · scoring · exclusion · skills</text>
  <rect x="580" y="320" width="244" height="44" rx="6" fill="#E4EDF6" stroke="#8FB4D9" stroke-width="1"/>
  <text x="590" y="338" class="bd" text-anchor="start">O3 Scenarios</text>
  <text x="590" y="356" class="sm" text-anchor="start">scenario · contract · review</text>
  <text x="60" y="386" class="sm" text-anchor="start">In-package bindings: api-sources + source-maps / field-maps carry the API data contract (DB via API; DB connector to come)</text>
  <line x1="440" y1="394" x2="440" y2="414" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="44" y="416" width="792" height="48" rx="8" fill="#FFFFFF" stroke="#8FB4D9" stroke-width="1"/>
  <text x="60" y="444" class="bd" text-anchor="start">④ Pre-issue validation: structure check → business replay (scope &amp; acceptance samples) → verified derive + load gate</text>
  <line x1="440" y1="464" x2="440" y2="484" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="44" y="486" width="792" height="32" rx="8" fill="#FFFFFF" stroke="#8FB4D9" stroke-width="1"/>
  <text x="60" y="506" class="bd" text-anchor="start">⑤ Human issue ISSUED → re-derive after issue and record fingerprints (= loadable)</text>
  <line x1="440" y1="530" x2="440" y2="550" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="24" y="552" width="832" height="214" rx="10" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="38" y="574" class="lane" text-anchor="start">Delivery lane · issued version → gates · acceptance · activation</text>
  <rect x="44" y="584" width="792" height="26" rx="6" fill="#FFFFFF" stroke="#EF9F27" stroke-width="1"/>
  <text x="60" y="602" class="bd" text-anchor="start">DRAFT → IN_REVIEW → ISSUED → loadable (gates pass) → active (pointer bound)</text>
  <rect x="44" y="618" width="186" height="76" rx="8" fill="#FFFFFF" stroke="#EF9F27" stroke-width="1"/>
  <text x="54" y="640" class="tt" text-anchor="start">Publish / deploy</text>
  <text x="54" y="660" class="bd" text-anchor="start">Platform: publish → activate</text>
  <text x="54" y="678" class="sm" text-anchor="start">Customer rail deploy.ps1</text>
  <rect x="244" y="618" width="186" height="76" rx="8" fill="#FFFFFF" stroke="#EF9F27" stroke-width="1"/>
  <text x="254" y="640" class="tt" text-anchor="start">Gate · managed gate</text>
  <text x="254" y="660" class="bd" text-anchor="start">Not active → rejected</text>
  <text x="254" y="678" class="sm" text-anchor="start">Unmanaged keeps dev mode</text>
  <rect x="444" y="618" width="186" height="76" rx="8" fill="#FFFFFF" stroke="#EF9F27" stroke-width="1"/>
  <text x="454" y="640" class="tt" text-anchor="start">Go-live acceptance</text>
  <text x="454" y="660" class="bd" text-anchor="start">Baseline replay · gaps</text>
  <text x="454" y="678" class="sm" text-anchor="start">unauthorized · per rail</text>
  <rect x="644" y="618" width="186" height="76" rx="8" fill="#FFFFFF" stroke="#EF9F27" stroke-width="1"/>
  <text x="654" y="640" class="tt" text-anchor="start">Activation</text>
  <text x="654" y="660" class="bd" text-anchor="start">Pointer bound (human)</text>
  <text x="654" y="678" class="sm" text-anchor="start">Rollback: same mechanism</text>
  <text x="60" y="714" class="bd" text-anchor="start">Boundary: a failed re-derive after issue can leave “issued but not loadable”; ISSUED ≠ loadable ≠ active</text>
  <line x1="440" y1="766" x2="440" y2="788" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="24" y="788" width="832" height="322" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="38" y="810" class="lane" text-anchor="start">Operations lane · dual entry → judgment → determination → feedback</text>
  <rect x="44" y="820" width="380" height="52" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="64" y="840" class="tt" text-anchor="start">Business expert agent</text>
  <text x="64" y="860" class="bd" text-anchor="start">Natural-language operations &amp; analysis</text>
  <rect x="456" y="820" width="380" height="52" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="476" y="840" class="tt" text-anchor="start">Business page system (plugin)</text>
  <text x="476" y="860" class="bd" text-anchor="start">Query · analyze · act · review · report</text>
  <line x1="234" y1="872" x2="234" y2="892" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="646" y1="872" x2="646" y2="892" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="44" y="894" width="792" height="44" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="440" y="921" class="bd" text-anchor="middle">Query · analyze · act (through approval card) · review · report (output contract = design time · result projection = run time)</text>
  <line x1="440" y1="938" x2="440" y2="956" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="44" y="958" width="792" height="40" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="440" y="983" class="bd" text-anchor="middle">Rule engine judgment: red lines · thresholds · evidence chains (AI never scores)</text>
  <line x1="440" y1="998" x2="440" y2="1016" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="44" y="1018" width="792" height="40" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="440" y="1043" class="bd" text-anchor="middle">Humans decide humanReviewRequired=true</text>
  <path d="M44,1066 C 28,1008 28,948 44,916" fill="none" stroke="#2E8B74" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a3)"/>
  <rect x="56" y="1064" width="250" height="32" rx="6" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="181" y="1085" class="bd" text-anchor="middle">Evidence short → pending verification</text>
  <rect x="318" y="1064" width="250" height="32" rx="6" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="443" y="1085" class="bd" text-anchor="middle">Human fix → run record back to queue</text>
  <rect x="580" y="1064" width="250" height="32" rx="6" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="705" y="1085" class="bd" text-anchor="middle">Rule change → new version, not ISSUED</text>
  <text x="24" y="1130" class="sm" text-anchor="start">blue=modeling  amber=delivery  teal=operations  purple=source types (on demand)</text>
</svg>
