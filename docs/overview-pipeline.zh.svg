<svg viewBox="0 0 880 1020" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#4A6FA5" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    .hd { font: 17px/500 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; fill:#1B2430; }
    .tt { font: 13px/500 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; fill:#1B2430; }
    .bd { font: 11px/400 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; fill:#3A4A5C; }
    .sm { font: 11px/400 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; fill:#6B7B8C; }
    .kw { font: 12px/500 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; fill:#FFFFFF; }
    .chip { font: 10px/500 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; fill:#FFFFFF; }
    .lgT { font: 12px/500 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; fill:#1B2430; }
    .lgB { font: 10.5px/400 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; fill:#4A5B6D; }
  </style>

  <text x="24" y="30" class="hd">通用版：知识库 → 本体 → 平台装配 → 辅助决策</text>
  <text x="24" y="50" class="sm">任意领域适用：金融 / 医院 / 科研 / 物流 / 制造…　紫=原料　蓝=规矩　橙=执行件</text>

  <!-- 左列 -->
  <rect x="24" y="72" width="200" height="540" rx="10" fill="#EDE4F5" stroke="#B799D4" stroke-width="1"/>
  <text x="38" y="98" class="tt">LLM 解析</text>
  <text x="38" y="116" class="sm">读旧沉淀 → 出草案，带置信度</text>

  <rect x="36" y="132" width="176" height="96" rx="8" fill="#FFFFFF" stroke="#D4C4E8" stroke-width="0.8"/>
  <text x="48" y="152" class="lgT">旧业务系统</text>
  <rect x="48" y="162" width="26" height="15" rx="4" fill="#5B7CFA"/><text x="61" y="173" class="chip" text-anchor="middle">O2</text>
  <rect x="78" y="162" width="26" height="15" rx="4" fill="#5B7CFA"/><text x="91" y="173" class="chip" text-anchor="middle">O3</text>
  <text x="112" y="173" class="lgB">抽：算法里的规则</text>
  <text x="48" y="194" class="sm">功能/算法/标签计算</text>
  <text x="48" y="210" class="sm">隐含「怎么判风险/异常」</text>

  <rect x="36" y="240" width="176" height="84" rx="8" fill="#FFFFFF" stroke="#D4C4E8" stroke-width="0.8"/>
  <text x="48" y="260" class="lgT">历史案例 / 样例数据</text>
  <rect x="48" y="270" width="26" height="15" rx="4" fill="#5B7CFA"/><text x="61" y="281" class="chip" text-anchor="middle">O1</text>
  <rect x="78" y="270" width="26" height="15" rx="4" fill="#5B7CFA"/><text x="91" y="281" class="chip" text-anchor="middle">O2</text>
  <text x="112" y="281" class="lgB">抽：对象 / 行为</text>
  <text x="48" y="302" class="sm">实体、动作、统计口径</text>

  <rect x="36" y="336" width="176" height="84" rx="8" fill="#FFFFFF" stroke="#D4C4E8" stroke-width="0.8"/>
  <text x="48" y="356" class="lgT">制度 / 规范 / 口径</text>
  <rect x="48" y="366" width="26" height="15" rx="4" fill="#5B7CFA"/><text x="61" y="377" class="chip" text-anchor="middle">O2</text>
  <rect x="78" y="366" width="26" height="15" rx="4" fill="#5B7CFA"/><text x="91" y="377" class="chip" text-anchor="middle">O3</text>
  <text x="112" y="377" class="lgB">抽：规则 + 红线</text>
  <text x="48" y="398" class="sm">阈值权重、禁用表述</text>

  <rect x="36" y="432" width="176" height="72" rx="8" fill="#FFFFFF" stroke="#D4C4E8" stroke-width="0.8"/>
  <text x="48" y="452" class="lgT">表结构 / 接口文档</text>
  <rect x="48" y="462" width="26" height="15" rx="4" fill="#5B7CFA"/><text x="61" y="473" class="chip" text-anchor="middle">O1</text>
  <text x="82" y="473" class="lgB">抽：属性 / 字段映射</text>
  <text x="48" y="494" class="sm">供取数绑定</text>

  <rect x="36" y="516" width="176" height="72" rx="8" fill="#FFFFFF" stroke="#D4C4E8" stroke-width="0.8"/>
  <text x="48" y="536" class="lgT">历史工单 / 任务单</text>
  <rect x="48" y="546" width="26" height="15" rx="4" fill="#5B7CFA"/><text x="61" y="557" class="chip" text-anchor="middle">O3</text>
  <text x="82" y="557" class="lgB">抽：场景 / 输出形态</text>
  <text x="48" y="578" class="sm">查什么、交什么结果</text>

  <text x="38" y="606" class="sm">人只做：确认 / 合并 / 驳回</text>

  <!-- 中列 -->
  <text x="433" y="62" class="tt" text-anchor="middle">主流程</text>

  <rect x="240" y="72" width="20" height="20" rx="5" fill="#5B7CFA"/>
  <text x="250" y="87" class="kw" text-anchor="middle">1</text>
  <rect x="268" y="78" width="330" height="88" rx="9" fill="#F4F7FF" stroke="#C9D6FA" stroke-width="0.8"/>
  <text x="282" y="102" class="tt">业务专家讲清「业务怎么运转」</text>
  <text x="282" y="122" class="bd">口头讲，或喂知识库文档</text>
  <text x="282" y="140" class="bd">有什么、会做什么、怎么判、什么不能说</text>
  <rect x="282" y="150" width="26" height="16" rx="4" fill="#5B7CFA"/><text x="295" y="162" class="chip" text-anchor="middle">O1</text>
  <rect x="312" y="150" width="26" height="16" rx="4" fill="#5B7CFA"/><text x="325" y="162" class="chip" text-anchor="middle">O2</text>
  <rect x="342" y="150" width="26" height="16" rx="4" fill="#5B7CFA"/><text x="355" y="162" class="chip" text-anchor="middle">O3</text>

  <line x1="433" y1="166" x2="433" y2="186" stroke="#4A6FA5" stroke-width="1.2" marker-end="url(#a1)"/>

  <rect x="240" y="202" width="20" height="20" rx="5" fill="#5B7CFA"/>
  <text x="250" y="217" class="kw" text-anchor="middle">2</text>
  <rect x="268" y="198" width="330" height="80" rx="9" fill="#F4F7FF" stroke="#C9D6FA" stroke-width="0.8"/>
  <text x="282" y="220" class="tt">AI 起草初稿，只出主意、不拍板</text>
  <text x="282" y="238" class="bd">猜对象/规则/场景，带信心分</text>
  <text x="282" y="254" class="bd">人来确认 / 合并 / 退回</text>
  <rect x="282" y="262" width="26" height="16" rx="4" fill="#5B7CFA"/><text x="295" y="274" class="chip" text-anchor="middle">O1</text>
  <rect x="312" y="262" width="26" height="16" rx="4" fill="#5B7CFA"/><text x="325" y="274" class="chip" text-anchor="middle">O2</text>
  <rect x="342" y="262" width="26" height="16" rx="4" fill="#5B7CFA"/><text x="355" y="274" class="chip" text-anchor="middle">O3</text>

  <line x1="433" y1="278" x2="433" y2="298" stroke="#4A6FA5" stroke-width="1.2" marker-end="url(#a1)"/>

  <rect x="240" y="314" width="20" height="20" rx="5" fill="#5B7CFA"/>
  <text x="250" y="329" class="kw" text-anchor="middle">3</text>
  <rect x="268" y="310" width="330" height="80" rx="9" fill="#F4F7FF" stroke="#C9D6FA" stroke-width="0.8"/>
  <text x="282" y="332" class="tt">人工盖章生效（签发）</text>
  <text x="282" y="350" class="bd">机器校验通过，人签发 = 规矩生效</text>
  <text x="282" y="366" class="bd">签发后谁都不许偷改</text>
  <rect x="282" y="374" width="26" height="16" rx="4" fill="#5B7CFA"/><text x="295" y="386" class="chip" text-anchor="middle">O1</text>
  <rect x="312" y="374" width="26" height="16" rx="4" fill="#5B7CFA"/><text x="325" y="386" class="chip" text-anchor="middle">O2</text>
  <rect x="342" y="374" width="26" height="16" rx="4" fill="#5B7CFA"/><text x="355" y="386" class="chip" text-anchor="middle">O3</text>

  <line x1="433" y1="390" x2="433" y2="410" stroke="#4A6FA5" stroke-width="1.2" marker-end="url(#a1)"/>

  <rect x="240" y="426" width="20" height="20" rx="5" fill="#2E9E6B"/>
  <text x="250" y="441" class="kw" text-anchor="middle">4</text>
  <rect x="268" y="422" width="330" height="86" rx="9" fill="#F0FAF6" stroke="#BFE5D4" stroke-width="0.8"/>
  <text x="282" y="444" class="tt">系统自动派生「干活指南」</text>
  <text x="282" y="462" class="bd">O 层规矩编译成 L 层执行件</text>
  <text x="282" y="478" class="bd">只读、手改拒跑（O→L 翻译层）</text>
  <rect x="282" y="488" width="26" height="16" rx="4" fill="#5B7CFA"/><text x="295" y="500" class="chip" text-anchor="middle">O3</text>
  <rect x="312" y="488" width="26" height="16" rx="4" fill="#E8933A"/><text x="325" y="500" class="chip" text-anchor="middle">L2</text>
  <rect x="342" y="488" width="26" height="16" rx="4" fill="#E8933A"/><text x="355" y="500" class="chip" text-anchor="middle">L3</text>
  <rect x="372" y="488" width="26" height="16" rx="4" fill="#E8933A"/><text x="385" y="500" class="chip" text-anchor="middle">L4</text>

  <text x="433" y="532" class="sm" text-anchor="middle">── 建规矩完 · 以下是干活 ──</text>

  <rect x="240" y="552" width="20" height="20" rx="5" fill="#E8933A"/>
  <text x="250" y="567" class="kw" text-anchor="middle">5</text>
  <rect x="268" y="548" width="330" height="80" rx="9" fill="#FFF8EC" stroke="#F0D9A8" stroke-width="0.8"/>
  <text x="282" y="570" class="tt">一线人员提需求</text>
  <text x="282" y="588" class="bd">「帮我看看这个客户/病例/订单…」</text>
  <text x="282" y="604" class="bd">从助手或业务系统入口进来</text>
  <rect x="282" y="612" width="26" height="16" rx="4" fill="#E8933A"/><text x="295" y="624" class="chip" text-anchor="middle">L5</text>
  <rect x="312" y="612" width="26" height="16" rx="4" fill="#5B7CFA"/><text x="325" y="624" class="chip" text-anchor="middle">O3</text>

  <line x1="433" y1="628" x2="433" y2="648" stroke="#4A6FA5" stroke-width="1.2" marker-end="url(#a1)"/>

  <rect x="240" y="664" width="20" height="20" rx="5" fill="#E8933A"/>
  <text x="250" y="679" class="kw" text-anchor="middle">6</text>
  <rect x="268" y="660" width="330" height="86" rx="9" fill="#FFF8EC" stroke="#F0D9A8" stroke-width="0.8"/>
  <text x="282" y="682" class="tt">AI 专家带工具挖线索</text>
  <text x="282" y="700" class="bd">查数据、算特征、找关联</text>
  <text x="282" y="716" class="bd">产「候选名单 + 理由」</text>
  <rect x="282" y="726" width="26" height="16" rx="4" fill="#E8933A"/><text x="295" y="738" class="chip" text-anchor="middle">L4</text>
  <rect x="312" y="726" width="26" height="16" rx="4" fill="#E8933A"/><text x="325" y="738" class="chip" text-anchor="middle">L3</text>
  <rect x="342" y="726" width="26" height="16" rx="4" fill="#E8933A"/><text x="355" y="738" class="chip" text-anchor="middle">L2</text>
  <rect x="372" y="726" width="26" height="16" rx="4" fill="#5B7CFA"/><text x="385" y="738" class="chip" text-anchor="middle">O1</text>

  <line x1="433" y1="746" x2="433" y2="766" stroke="#4A6FA5" stroke-width="1.2" marker-end="url(#a1)"/>

  <rect x="240" y="782" width="20" height="20" rx="5" fill="#E8933A"/>
  <text x="250" y="797" class="kw" text-anchor="middle">7</text>
  <rect x="268" y="778" width="330" height="80" rx="9" fill="#FFF8EC" stroke="#F0D9A8" stroke-width="0.8"/>
  <text x="282" y="800" class="tt">机器按公式打分 + 查红线</text>
  <text x="282" y="818" class="bd">每分对账到规则；越界表述直接打回</text>
  <text x="282" y="834" class="bd">AI 不许自己算分、不许下认定</text>
  <rect x="282" y="842" width="26" height="16" rx="4" fill="#5B7CFA"/><text x="295" y="854" class="chip" text-anchor="middle">O2</text>
  <rect x="312" y="842" width="26" height="16" rx="4" fill="#5B7CFA"/><text x="325" y="854" class="chip" text-anchor="middle">O3</text>

  <line x1="433" y1="858" x2="433" y2="878" stroke="#4A6FA5" stroke-width="1.2" marker-end="url(#a1)"/>

  <rect x="240" y="894" width="20" height="20" rx="5" fill="#D64545"/>
  <text x="250" y="909" class="kw" text-anchor="middle">8</text>
  <rect x="268" y="890" width="330" height="80" rx="9" fill="#FDF0F0" stroke="#F0C4C4" stroke-width="0.8"/>
  <text x="282" y="912" class="tt">最后人来拍板</text>
  <text x="282" y="930" class="bd">交出「候选 + 分数 + 证据 + 待核实点」</text>
  <text x="282" y="946" class="bd">认定/审批/处置，只有人说了算</text>
  <rect x="282" y="954" width="26" height="16" rx="4" fill="#5B7CFA"/><text x="295" y="966" class="chip" text-anchor="middle">O3</text>

  <!-- 右列 -->
  <line x1="616" y1="68" x2="616" y2="980" stroke="#E2E8F0" stroke-width="1"/>
  <text x="630" y="88" class="hd">图例</text>
  <text x="630" y="106" class="sm">换领域只换词，不换骨架</text>

  <rect x="626" y="120" width="230" height="72" rx="8" fill="#F4F7FF" stroke="#C9D6FA" stroke-width="0.8"/>
  <rect x="638" y="132" width="26" height="16" rx="4" fill="#5B7CFA"/><text x="651" y="144" class="chip" text-anchor="middle">O1</text>
  <text x="672" y="144" class="lgT">对象层 · 有什么</text>
  <text x="638" y="164" class="lgB">实体/关系/字典</text>
  <text x="638" y="182" class="sm">统一身份与取数口径</text>

  <rect x="626" y="200" width="230" height="72" rx="8" fill="#F4F7FF" stroke="#C9D6FA" stroke-width="0.8"/>
  <rect x="638" y="212" width="26" height="16" rx="4" fill="#5B7CFA"/><text x="651" y="224" class="chip" text-anchor="middle">O2</text>
  <text x="672" y="224" class="lgT">规则层 · 怎么判</text>
  <text x="638" y="244" class="lgB">行为/打分/排除</text>
  <text x="638" y="262" class="sm">打分唯一依据，可对账</text>

  <rect x="626" y="280" width="230" height="72" rx="8" fill="#F4F7FF" stroke="#C9D6FA" stroke-width="0.8"/>
  <rect x="638" y="292" width="26" height="16" rx="4" fill="#5B7CFA"/><text x="651" y="304" class="chip" text-anchor="middle">O3</text>
  <text x="672" y="304" class="lgT">场景层 · 边界</text>
  <text x="638" y="324" class="lgB">场景/输出契约/复核</text>
  <text x="638" y="342" class="sm">只出候选，不下认定</text>

  <rect x="626" y="360" width="230" height="52" rx="8" fill="#FFF8EC" stroke="#F0D9A8" stroke-width="0.8"/>
  <rect x="638" y="370" width="26" height="16" rx="4" fill="#E8933A"/><text x="651" y="382" class="chip" text-anchor="middle">L1</text>
  <text x="672" y="382" class="lgT">应用 · 从哪进来</text>
  <text x="638" y="402" class="sm">嵌入业务系统的入口</text>

  <rect x="626" y="420" width="230" height="52" rx="8" fill="#FFF8EC" stroke="#F0D9A8" stroke-width="0.8"/>
  <rect x="638" y="430" width="26" height="16" rx="4" fill="#E8933A"/><text x="651" y="442" class="chip" text-anchor="middle">L2</text>
  <text x="672" y="442" class="lgT">工具池 · 家伙</text>
  <text x="638" y="462" class="sm">查询/计算/对接接口</text>

  <rect x="626" y="480" width="230" height="52" rx="8" fill="#FFF8EC" stroke="#F0D9A8" stroke-width="0.8"/>
  <rect x="638" y="490" width="26" height="16" rx="4" fill="#E8933A"/><text x="651" y="502" class="chip" text-anchor="middle">L3</text>
  <text x="672" y="502" class="lgT">技能 · 怎么组合用</text>
  <text x="638" y="522" class="sm">工具调用方法论</text>

  <rect x="626" y="540" width="230" height="52" rx="8" fill="#FFF8EC" stroke="#F0D9A8" stroke-width="0.8"/>
  <rect x="638" y="550" width="26" height="16" rx="4" fill="#E8933A"/><text x="651" y="562" class="chip" text-anchor="middle">L4</text>
  <text x="672" y="562" class="lgT">专家 · 谁来干</text>
  <text x="638" y="582" class="sm">持多技能 + 探索关联</text>

  <rect x="626" y="600" width="230" height="52" rx="8" fill="#FFF8EC" stroke="#F0D9A8" stroke-width="0.8"/>
  <rect x="638" y="610" width="26" height="16" rx="4" fill="#E8933A"/><text x="651" y="622" class="chip" text-anchor="middle">L5</text>
  <text x="672" y="622" class="lgT">助手 · 门面</text>
  <text x="638" y="642" class="sm">形象/锚点/对话入口</text>

  <rect x="626" y="666" width="230" height="72" rx="8" fill="#F5F0FA" stroke="#D4C4E8" stroke-width="0.8"/>
  <text x="638" y="688" class="lgT">知识库 · 旧系统沉淀</text>
  <text x="638" y="708" class="lgB">算法/标签 = 隐含规则</text>
  <text x="638" y="726" class="sm">LLM 解析 → 草案 → 人审</text>

  <text x="626" y="768" class="sm">换领域 = 换包内容，不换语法：</text>
  <text x="626" y="786" class="sm">金融换账户/交易，医院换患者/医嘱</text>
  <text x="626" y="804" class="sm">物流换货/仓/运单——骨架原样跑</text>
</svg>
