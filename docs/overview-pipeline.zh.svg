<svg viewBox="0 0 880 1330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#4A6FA5" stroke-width="1.2"/>
    </marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#B07D2B" stroke-width="1.2"/>
    </marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#2E8B74" stroke-width="1.2"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif; }
    .hd { font-size: 17px; font-weight: 500; fill: #1B2430; }
    .tt { font-size: 13px; font-weight: 500; fill: #1B2430; }
    .bd { font-size: 11px; font-weight: 400; fill: #3A4A5C; }
    .sm { font-size: 11px; font-weight: 400; fill: #6B7B8C; }
    .kw { font-size: 11.5px; font-weight: 500; fill: #FFFFFF; }
    .chip { font-size: 10px; font-weight: 500; fill: #FFFFFF; }
    .lane { font-size: 12px; font-weight: 500; fill: #1B2430; }
  </style>
  <text x="24" y="30" class="hd" text-anchor="start">通用方法论三线：建模 → 交付 → 运行</text>
  <text x="24" y="50" class="sm" text-anchor="start">任意领域适用：金融 / 医院 / 科研 / 物流 / 制造…　蓝=建模线　橙=交付线　青=运行线　紫=原料来源（按需选取）</text>
  <rect x="24" y="70" width="832" height="460" rx="10" fill="#E4EDF6" stroke="#8FB4D9" stroke-width="1"/>
  <text x="38" y="92" class="lane" text-anchor="start">建模线 · 从业务问题到人工签发</text>
  <rect x="44" y="104" width="792" height="56" rx="8" fill="#FFFFFF" stroke="#8FB4D9" stroke-width="1"/>
  <text x="60" y="126" class="tt" text-anchor="start">① 业务问题定义（先于原料）</text>
  <text x="60" y="148" class="bd" text-anchor="start">场景目标 · 适用边界 · 期望结果 · 反例 —— 先回答“要解决什么问题”</text>
  <line x1="440" y1="160" x2="440" y2="180" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="44" y="182" width="792" height="86" rx="8" fill="#FFFFFF" stroke="#8FB4D9" stroke-width="1"/>
  <text x="60" y="204" class="tt" text-anchor="start">② 按需选取原料（六类来源，非必经步骤）</text>
  <rect x="54" y="214" width="120" height="44" rx="6" fill="#B799D4" stroke="#B799D4" stroke-width="1"/>
  <text x="114.0" y="231" class="kw" text-anchor="middle">遗留系统</text>
  <text x="114.0" y="247" class="chip" text-anchor="middle">LEGACY_SYS</text>
  <rect x="182" y="214" width="120" height="44" rx="6" fill="#B799D4" stroke="#B799D4" stroke-width="1"/>
  <text x="242.0" y="231" class="kw" text-anchor="middle">案例样本</text>
  <text x="242.0" y="247" class="chip" text-anchor="middle">CASE_SAMPLE</text>
  <rect x="310" y="214" width="120" height="44" rx="6" fill="#B799D4" stroke="#B799D4" stroke-width="1"/>
  <text x="370.0" y="231" class="kw" text-anchor="middle">政策标准</text>
  <text x="370.0" y="247" class="chip" text-anchor="middle">POLICY</text>
  <rect x="438" y="214" width="120" height="44" rx="6" fill="#B799D4" stroke="#B799D4" stroke-width="1"/>
  <text x="498.0" y="231" class="kw" text-anchor="middle">Schema / API</text>
  <text x="498.0" y="247" class="chip" text-anchor="middle">SCHEMA_API</text>
  <rect x="566" y="214" width="120" height="44" rx="6" fill="#B799D4" stroke="#B799D4" stroke-width="1"/>
  <text x="626.0" y="231" class="kw" text-anchor="middle">工单任务</text>
  <text x="626.0" y="247" class="chip" text-anchor="middle">WORK_ORDER</text>
  <rect x="694" y="214" width="120" height="44" rx="6" fill="#B799D4" stroke="#B799D4" stroke-width="1"/>
  <text x="754.0" y="231" class="kw" text-anchor="middle">对话口述</text>
  <text x="754.0" y="247" class="chip" text-anchor="middle">CONVERSATION</text>
  <line x1="440" y1="268" x2="440" y2="288" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <text x="456" y="281" class="sm" text-anchor="start">原料 →（LLM 起草）候选草案 → 人审批准后物化</text>
  <rect x="44" y="290" width="792" height="104" rx="8" fill="#FFFFFF" stroke="#8FB4D9" stroke-width="1"/>
  <text x="60" y="312" class="tt" text-anchor="start">③ 本体建模 O1 · O2 · O3</text>
  <rect x="56" y="320" width="244" height="44" rx="6" fill="#E4EDF6" stroke="#8FB4D9" stroke-width="1"/>
  <text x="66" y="338" class="bd" text-anchor="start">O1 对象层</text>
  <text x="66" y="356" class="sm" text-anchor="start">对象 · 关系 · 字典</text>
  <rect x="318" y="320" width="244" height="44" rx="6" fill="#E4EDF6" stroke="#8FB4D9" stroke-width="1"/>
  <text x="328" y="338" class="bd" text-anchor="start">O2 规则层</text>
  <text x="328" y="356" class="sm" text-anchor="start">行为（Action）· 打分 · 排除 · 技能</text>
  <rect x="580" y="320" width="244" height="44" rx="6" fill="#E4EDF6" stroke="#8FB4D9" stroke-width="1"/>
  <text x="590" y="338" class="bd" text-anchor="start">O3 场景层</text>
  <text x="590" y="356" class="sm" text-anchor="start">场景卡 · 输出契约 · 复核阈值</text>
  <text x="60" y="386" class="sm" text-anchor="start">包内 bindings：api-sources + source-maps / field-maps —— 承载 API 数据契约（库表经 API 暴露；DB 直连连接器待扩展）</text>
  <line x1="440" y1="394" x2="440" y2="414" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="44" y="416" width="792" height="48" rx="8" fill="#FFFFFF" stroke="#8FB4D9" stroke-width="1"/>
  <text x="60" y="444" class="bd" text-anchor="start">④ 签发前：结构校验 → 生成派生物并通过加载校验 → 业务回放与人工评审（建议评审步骤，非签发硬门禁）</text>
  <line x1="440" y1="464" x2="440" y2="484" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="44" y="486" width="792" height="32" rx="8" fill="#FFFFFF" stroke="#8FB4D9" stroke-width="1"/>
  <text x="60" y="506" class="bd" text-anchor="start">⑤ 人工签发 ISSUED → 签发后重派生并记录指纹（= 可加载）</text>
  <line x1="440" y1="530" x2="440" y2="550" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="24" y="552" width="832" height="214" rx="10" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
  <text x="38" y="574" class="lane" text-anchor="start">交付线 · 已签发版本 → 门禁 · 验收 · 激活</text>
  <rect x="44" y="584" width="792" height="26" rx="6" fill="#FFFFFF" stroke="#EF9F27" stroke-width="1"/>
  <text x="60" y="602" class="bd" text-anchor="start">DRAFT → IN_REVIEW → ISSUED → 可加载（门禁过）→ 已激活（活动指针绑定）</text>
  <rect x="44" y="618" width="186" height="76" rx="8" fill="#FFFFFF" stroke="#EF9F27" stroke-width="1"/>
  <text x="54" y="640" class="tt" text-anchor="start">发布 / 部署</text>
  <text x="54" y="660" class="bd" text-anchor="start">平台轨 publish → activate</text>
  <text x="54" y="678" class="sm" text-anchor="start">独立客户轨 deploy.ps1</text>
  <rect x="244" y="618" width="186" height="76" rx="8" fill="#FFFFFF" stroke="#EF9F27" stroke-width="1"/>
  <text x="254" y="640" class="tt" text-anchor="start">门禁 · 受管闸</text>
  <text x="254" y="660" class="bd" text-anchor="start">未激活拒 · fail-closed</text>
  <text x="254" y="678" class="sm" text-anchor="start">未受管包保持开发语义</text>
  <rect x="444" y="618" width="186" height="76" rx="8" fill="#FFFFFF" stroke="#EF9F27" stroke-width="1"/>
  <text x="454" y="640" class="tt" text-anchor="start">上线验收</text>
  <text x="454" y="660" class="bd" text-anchor="start">基线回放 · 缺数 · 越权</text>
  <text x="454" y="678" class="sm" text-anchor="start">（按交付轨要求）</text>
  <rect x="644" y="618" width="186" height="76" rx="8" fill="#FFFFFF" stroke="#EF9F27" stroke-width="1"/>
  <text x="654" y="640" class="tt" text-anchor="start">激活</text>
  <text x="654" y="660" class="bd" text-anchor="start">活动指针绑定（人工）</text>
  <text x="654" y="678" class="sm" text-anchor="start">版本回滚同机制</text>
  <text x="60" y="714" class="bd" text-anchor="start">边界：签发后重派生失败 → 可能“已签发但不可加载”；ISSUED ≠ 可加载 ≠ 已激活</text>
  <line x1="440" y1="766" x2="440" y2="788" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="24" y="788" width="832" height="482" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="38" y="810" class="lane" text-anchor="start">运行线 · 双入口 → 判定 → 结果（须人审）→ 复核 → 认定 → 反馈</text>
  <rect x="44" y="820" width="380" height="52" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="64" y="840" class="tt" text-anchor="start">业务专家 agent</text>
  <text x="64" y="860" class="bd" text-anchor="start">自然语言操作与分析</text>
  <rect x="456" y="820" width="380" height="52" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="476" y="840" class="tt" text-anchor="start">业务页面系统（页面插件）</text>
  <text x="476" y="860" class="bd" text-anchor="start">查询 · 分析 · 动作 · 复核 · 报表</text>
  <line x1="234" y1="872" x2="300" y2="892" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="646" y1="872" x2="540" y2="892" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="200" y="894" width="440" height="40" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="420" y="918" class="bd" text-anchor="middle">查询 · 分析（挖线索：query · compute · links）</text>
  <rect x="200" y="958" width="440" height="40" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="420" y="982" class="bd" text-anchor="middle">规则引擎判定：红线 · 阈值 · 证据链（AI 不打分）</text>
  <rect x="200" y="1018" width="440" height="40" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="420" y="1042" class="bd" text-anchor="middle">运行结果（须人审 humanReviewRequired=true）</text>
  <rect x="200" y="1076" width="440" height="40" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="420" y="1100" class="bd" text-anchor="middle">复核队列（review queue）</text>
  <rect x="200" y="1134" width="440" height="40" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="420" y="1158" class="bd" text-anchor="middle">人工认定（determination）</text>
  <line x1="420" y1="938" x2="420" y2="956" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="420" y1="998" x2="420" y2="1016" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="420" y1="1058" x2="420" y2="1076" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <line x1="420" y1="1116" x2="420" y2="1134" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="656" y="1018" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="746" y="1042" class="bd" text-anchor="middle">报表（结果投影）</text>
  <text x="656" y="1076" class="sm" text-anchor="start">契约＝设计时定义</text>
  <line x1="640" y1="1038" x2="656" y2="1038" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="656" y="1134" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1"/>
  <text x="746" y="1158" class="bd" text-anchor="middle">动作（过批准卡）</text>
  <line x1="640" y1="1154" x2="656" y2="1154" stroke="#4A6FA5" stroke-width="1.4" marker-end="url(#a1)"/>
  <rect x="44" y="1194" width="380" height="56" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="234" y="1216" class="bd" text-anchor="middle">① 证据不足 → 待核实（pendingChecks）</text>
  <text x="234" y="1238" class="sm" text-anchor="middle">随 run 留存 · 回查询/分析补数</text>
  <rect x="456" y="1194" width="380" height="56" rx="8" fill="#FFFFFF" stroke="#5DCAA5" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="646" y="1216" class="bd" text-anchor="middle">② 人审修正 → 经验回填 →</text>
  <text x="646" y="1238" class="sm" text-anchor="middle">必要时候选草案 → 人审批准 → 新版本（回建模线）</text>
  <path d="M200,1038 L120,1038 L120,1194" fill="none" stroke="#2E8B74" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a3)"/>
  <path d="M44,1216 C 26,1150 26,980 200,916" fill="none" stroke="#2E8B74" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a3)"/>
  <path d="M420,1174 C 500,1182 580,1182 640,1194" fill="none" stroke="#2E8B74" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a3)"/>
  <path d="M836,1222 C 868,1100 868,420 856,262" fill="none" stroke="#2E8B74" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a3)"/>
  <text x="24" y="1310" class="sm" text-anchor="start">蓝=建模线　橙=交付线　青=运行线　紫=原料来源（按需选取）</text>
</svg>
